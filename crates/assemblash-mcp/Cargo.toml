[package]
name = "assemblash-mcp"
description = "Model Context Protocol server over the Assemblash operation layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
assemblash-core.workspace = true
assemblash-renderer.workspace = true
assemblash-server.workspace = true
rmcp = { version = "3.1.0", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    # The hosted endpoint: the editor process serves MCP at `/mcp` over the
    # same state as its HTTP API, so an agent never locks the person out.
    "transport-streamable-http-server",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.19"
tokio = { version = "1.49.0", default-features = false, features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "sync",
    "io-util",
    "time",
] }
# The cancellation token rmcp's HTTP service takes, to end open event streams
# when the editor stops. Already in the graph through rmcp.
tokio-util = { version = "0.7.19", default-features = false }
# The stdio relay posts to a running editor's `/mcp` endpoint. Already in the
# graph through the renderer's font installer; loopback needs no TLS, but the
# default features are what the graph already carries.
ureq = "3.3.0"

[lints]
workspace = true

# The exit test spawns the real `assemblash` binary, which lives in the CLI
# crate. It cannot be a dev-dependency — that crate has no library, and a
# dependency pulls a package's lib rather than its bins — so `tests/support`
# builds it with cargo once per test process and uses the executable path from
# Cargo's artifact message. Relying on `cargo test --workspace` having built it
# first let a `-p assemblash-mcp` run pass against a stale binary.
[dev-dependencies]
png = "0.18.1"
rmcp = { version = "3.1.0", default-features = false, features = [
    "client",
    "transport-child-process",
] }
tempfile = "3.27.0"
tokio = { version = "1.49.0", default-features = false, features = [
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }
