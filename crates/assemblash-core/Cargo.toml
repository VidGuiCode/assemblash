[package]
name = "assemblash-core"
description = "Assemblash document model, validation, and operation layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
roxmltree = "0.21.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: unknown nested objects keep their key order on the way back
# out. float_roundtrip: without it, parsing a float can land on a different
# f64 than the one written — a saved-then-reloaded document would render
# differently, which breaks the determinism the product is built on (NFR-1).
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
# Workspace settings. TOML rather than JSON because config.toml is a file a
# person edits by hand, and comments survive being read back.
toml = "0.9.11"
ulid = "3.0.0"

[features]
# Test-only fault injection: lets a test abort the process at an exact point
# so crash recovery can be exercised for real rather than simulated. Never
# enabled in a release build.
fault-injection = []

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
