[package]
name = "assemblash-cli"
description = "Assemblash command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "assemblash"
path = "src/main.rs"

[dependencies]
assemblash-core.workspace = true
assemblash-renderer.workspace = true
clap = { version = "4.6.5", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
png = "0.18.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
