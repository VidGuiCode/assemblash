[package]
name = "assemblash-cli"
description = "Assemblash command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "assemblash"
path = "src/main.rs"

[dependencies]
assemblash-core.workspace = true
assemblash-mcp.workspace = true
assemblash-renderer.workspace = true
assemblash-server.workspace = true
# env: paths like the font store and the workspace can come from
# `--font-store` / `--workspace` or from the environment, so a container or a
# shell profile can set them once.
clap = { version = "4.6.5", features = ["derive", "env"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# Only `serve` needs a runtime; every other command stays synchronous.
tokio = { version = "1.49.0", default-features = false, features = ["rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
# Fault injection is enabled only for the test build of the binary, so the
# crash-recovery tests can kill it at an exact point. Release builds never see
# it.
assemblash-core = { workspace = true, features = ["fault-injection"] }
png = "0.18.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
