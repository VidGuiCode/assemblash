[package]
name = "assemblash-cli"
description = "Assemblash command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "assemblash"
path = "src/main.rs"

[dependencies]
assemblash-core.workspace = true
assemblash-renderer.workspace = true
# env: the font store is named by `--font-store` or `ASSEMBLASH_FONT_STORE`,
# so a container or a shell profile can set it once.
clap = { version = "4.6.5", features = ["derive", "env"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
# Fault injection is enabled only for the test build of the binary, so the
# crash-recovery tests can kill it at an exact point. Release builds never see
# it.
assemblash-core = { workspace = true, features = ["fault-injection"] }
png = "0.18.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
