<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Assemblash — structured visual composition with precise, reversible edits."
    data-i18n-attr="content:app.description" />
    <title>Assemblash</title>
    <link rel="stylesheet" href="phosphor.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div id="chrome-header-root"></div>
      </header>

      <main class="workspace">
        <nav class="toolrail" aria-label="Editor tools" data-i18n-attr="aria-label:toolbar.label">
          <div id="chrome-toolrail-root"></div>
        </nav>

        <aside id="add-panel" class="add-panel" aria-label="Add content" data-i18n-attr="aria-label:panels.addLabel">
          <div id="chrome-add-root"></div>
        </aside>

        <section class="editor" aria-label="Document editor" data-i18n-attr="aria-label:editor.label">
          <div id="inspector" class="contextual-toolbar" aria-label="Contextual selection toolbar" data-i18n-attr="aria-label:editor.contextualToolbar">
            <div class="inspector-empty"><i class="ph ph-cursor-click" aria-hidden="true"></i><span><span data-i18n="editor.selectLayerHint">Select a layer to edit it</span></span></div>
          </div>
          <div class="stage-viewport" id="stage-viewport">
            <div class="stage" id="stage">
              <div id="canvas-surface-root" style="display: contents"></div>
            </div>
          </div>
          <div id="canvas-controls-root" hidden></div>
        </section>

        <aside id="structure-panel" class="structure" aria-label="Properties, layers and history"></aside>
      </main>

      <div id="status-chrome-root"></div>
    </div>

    <!-- The six containers the engine imports; a name it would refuse is
         refused by the engine too, in its own words. -->
    <input id="font-file" type="file" accept=".ttf,.otf,.ttc,.otc,.woff,.woff2" multiple hidden />
    <div id="position-popover-root"></div>

    <div id="context-menu-root"></div>

    <div id="new-project-dialog-mount"></div>

    <div id="export-dialog-mount"></div>

    <div id="settings-dialog-mount"></div>

    <div id="templates-mantine-mount"></div>

    <div id="mantine-root" hidden></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
