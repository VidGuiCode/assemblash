<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assemblash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Assemblash</h1>
      <select id="projects" aria-label="Project"></select>
      <button id="new-project" type="button">New project</button>
      <button id="reload" type="button">Reload</button>
      <input id="project-search" type="search" placeholder="Search projects" aria-label="Search projects" />
      <span class="spacer"></span>
      <span class="version-label">version <span id="version">–</span></span>
      <button id="shutdown" type="button" hidden>Stop Assemblash</button>
    </header>

    <main>
      <section class="panel left">
        <!-- Recently modified projects, from the engine's workspace cache. -->
        <div id="recents" hidden></div>
        <h2>Layers</h2>
        <ul id="layers"></ul>
        <div class="buttons">
          <button id="add-text" type="button">Add text</button>
          <button id="add-image" type="button">Add image</button>
          <input id="image-file" type="file" accept="image/*,.svg" hidden />
          <button id="group-layers" type="button" disabled>Group</button>
          <button id="delete-layer" type="button" disabled>Delete</button>
        </div>
      </section>

      <section class="stage">
        <!--
          The engine's own render, as an image. The page never interprets
          document content as markup, and what is shown is byte-for-byte what
          an export at the same scale writes.
        -->
        <div id="canvas">
          <img id="canvas-image" alt="" />
          <div id="overlay"></div>
        </div>
        <div class="buttons">
          <button id="undo" type="button" disabled>Undo</button>
          <button id="redo" type="button" disabled>Redo</button>
          <button id="export" type="button">Export PNG</button>
          <a id="download" href="#" download="assemblash.png" hidden>Download PNG</a>
          <a id="download-svg" href="#" download="assemblash.svg" hidden>Download SVG</a>
        </div>
        <div id="status" data-kind="info">Loading…</div>
        <p class="hint shortcuts">
          Arrows nudge · Shift+arrows nudge by 10 · Delete removes ·
          Ctrl/Cmd+Z undo · Ctrl/Cmd+Shift+Z redo
        </p>
      </section>

      <section class="panel right">
        <h2>Inspector</h2>
        <div id="inspector"></div>
        <h2>History</h2>
        <ol id="history"></ol>
      </section>
    </main>

    <!--
      Templates. Hidden entirely unless the open project declares slots: a
      panel offering to fill nothing is worse than no panel. Filling here is
      the same operation the CLI and MCP build, so protected layers refuse
      from this form exactly as they refuse everywhere else.
    -->
    <section class="templates" id="templates" hidden>
      <div class="template-fill">
        <h2>Template</h2>
        <div id="slot-form"></div>
        <input id="slot-image-file" type="file" accept="image/*,.svg" hidden />
        <div class="buttons">
          <button id="preview-variant" type="button">Preview</button>
          <input id="variant-name" type="text" placeholder="variant name" aria-label="Variant name" />
          <button id="add-variant" type="button">Add to batch</button>
        </div>
      </div>

      <div class="template-batch">
        <h2>Batch</h2>
        <ol id="variant-rows"></ol>
        <div class="buttons">
          <button id="load-values" type="button">Load values file…</button>
          <input id="values-file" type="file" accept="application/json,.json" hidden />
          <button id="render-batch" type="button" disabled>Render batch</button>
          <button id="clear-batch" type="button" disabled>Clear</button>
        </div>
      </div>

      <div class="template-gallery">
        <h2>Variants</h2>
        <div id="gallery"></div>
      </div>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
