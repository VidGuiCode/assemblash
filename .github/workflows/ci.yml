name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job carries a `timeout-minutes`. A job that hangs reports nothing —
# no failure, no log, and no result at all until somebody notices and cancels
# it by hand — which is worse than a job that fails. The numbers are several
# times the observed durations on a warm cache, so a cold cache or a slow
# runner still finishes well inside them; they exist to bound a hang, not to
# police a slow build.
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required community files are present
        run: |
          missing=0
          for f in README.md PRD.md AGENTS.md LICENSE NOTICE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .gitattributes; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No private or generated content committed
        run: |
          # PRD R5: private brand kits, credentials, and customer content must
          # never reach the public repository.
          bad=$(git ls-files | grep -Ei '(^|/)(private|brand|brandkits|customer-assets|downstream)/|(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$|(^|/)node_modules/' || true)
          if [ -n "$bad" ]; then
            echo "::error::files that must not be committed were found:"
            echo "$bad"
            exit 1
          fi

      - name: The dependency inventory is committed
        run: |
          # PRD §18. The content is drift-tested by `cargo test`; this only
          # checks the file a reader expects to find is actually there.
          test -f DEPENDENCIES.md

      - name: No local AI working directories committed
        run: |
          # .ai/ holds working notes; .agents/ holds per-tool installed skills.
          # Reusable public agent guidance belongs under skills/ instead.
          bad=$(git ls-files | grep -E '^(\.ai|\.agents)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::local AI working directories must stay untracked:"
            echo "$bad"
            exit 1
          fi

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ui:
    name: Reference interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      # The interface is typed against the declarations generated from the
      # Rust types, so a change to the document model that the UI has not
      # caught up with fails here rather than at runtime. `check` runs the
      # typecheck, the build, and the test suite (ubuntu-latest ships the
      # Chrome the browser journeys need).
      - name: Check (typecheck, build, test)
        working-directory: ui
        run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check bundled UI licence notices
        run: python scripts/ui_notices.py --check

      - name: Check embedded assets and public login dependencies
        run: python scripts/ui_assets.py --check

      # ui/dist is committed because the binary embeds it: `cargo build` must
      # work with no Node involved. This is what keeps the committed copy
      # honest.
      - name: The committed build output is the build output
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo "::error::ui/dist is out of date — run: cd ui && npm run build"
            git diff --stat -- ui/dist
            exit 1
          fi

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Automates PRD R8: license allowlist, advisories, source allowlist.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    # Determinism is the product: the same code must build and pass on every
    # supported target from the first commit (NFR-1, NFR-2).
    name: Test (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
          - os: windows-latest
            target-name: windows-x86_64
          - os: windows-11-arm
            target-name: windows-aarch64
          # macos-13 was retired; macos-15-intel is the current Intel runner.
          - os: macos-15-intel
            target-name: macos-x86_64
          - os: macos-14
            target-name: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target-name }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exercise the executable across CLI, HTTP and MCP
        run: >-
          python scripts/release_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-ci-smoke"

      - name: Verify canvas resize, transparency and undo across transports
        run: >-
          python scripts/canvas_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-canvas-smoke"
          --font crates/assemblash-renderer/tests/fonts/NotoSans-Subset.ttf

      - name: Verify font import, SVG-text refusal and stale-lock reclaim without a terminal
        run: >-
          python scripts/no_terminal_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-no-terminal-smoke"

      - name: Verify paints and canvas images across transports
        run: >-
          python scripts/paint_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-paint-smoke"

      - name: Save renderer identity report
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.target-name }}
          path: target/gate/hashes.json
          if-no-files-found: error

      - name: Verify styled runs across CLI, HTTP and MCP
        run: >-
          python scripts/styled_runs_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-styled-runs-smoke"
      - name: Verify styled archive routing
        run: python -m unittest discover -s scripts -p test_styled_runs_smoke.py

      - name: Verify paragraph spacing across CLI, HTTP and MCP
        run: >-
          python scripts/paragraph_spacing_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-paragraph-spacing-smoke"
      - name: Verify justified alignment across CLI, HTTP and MCP
        run: >-
          python scripts/justification_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-justification-smoke"

  render-identity:
    name: Compare renderer bytes on all six targets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: renderer-*
          path: renderer-hashes
      - run: python scripts/renderer_identity_compare.py renderer-hashes

  candidate:
    name: Candidate binary (${{ matrix.target-name }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1.12.0'
    needs: [hygiene, lint, ui, deny, test, render-identity]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
          - os: windows-latest
            target-name: windows-x86_64
          - os: windows-11-arm
            target-name: windows-aarch64
          - os: macos-15-intel
            target-name: macos-x86_64
          - os: macos-14
            target-name: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: candidate-${{ matrix.target-name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build --release -p assemblash-cli
      - name: Verify renderer identity in the release profile
        run: cargo test --release -p assemblash-renderer --test gate
      - name: Exercise the candidate executable
        run: >-
          python scripts/release_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-smoke"
      - name: Verify candidate canvas editing
        run: >-
          python scripts/canvas_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-canvas-smoke"
          --font crates/assemblash-renderer/tests/fonts/NotoSans-Subset.ttf
      - name: Verify candidate embedded operation without a terminal
        run: >-
          python scripts/no_terminal_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-no-terminal-smoke"
      - name: Verify candidate agent concurrency
        run: >-
          python scripts/agents_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
      - name: Verify candidate paints and canvas images
        run: >-
          python scripts/paint_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-paint-smoke"
      - name: Verify candidate styled runs across CLI, HTTP and MCP
        run: >-
          python scripts/styled_runs_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-styled-runs-smoke"
      - name: Verify candidate paragraph spacing across CLI, HTTP and MCP
        run: >-
          python scripts/paragraph_spacing_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-paragraph-spacing-smoke"
      - name: Verify candidate justified alignment across CLI, HTTP and MCP
        run: >-
          python scripts/justification_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-candidate-justification-smoke"
      - uses: actions/setup-node@v4
        if: matrix.target-name == 'linux-x86_64'
        with:
          node-version: "22"
      - name: Verify embedded browser authentication and offline assets
        if: matrix.target-name == 'linux-x86_64'
        run: >-
          node scripts/ui_latency_benchmark.mjs
          --binary target/release/assemblash
          --workspace "${{ runner.temp }}/assemblash-candidate-browser"
          --fixture "${{ runner.temp }}/assemblash-candidate-browser-fixture.json"
          --output "${{ runner.temp }}/assemblash-candidate-browser.json"
          --login-check true
          --samples 5
          --label candidate-auth-offline
      - name: Verify candidate Runs table against the embedded server
        if: matrix.target-name == 'linux-x86_64'
        run: >-
          node scripts/styled_runs_browser.mjs
          --binary target/release/assemblash
          --workspace "${{ runner.temp }}/assemblash-candidate-runs-editor"
          --output "${{ runner.temp }}/assemblash-candidate-runs-editor-evidence/result.json"
      - name: Verify candidate paragraph controls against the embedded server
        if: matrix.target-name == 'linux-x86_64'
        run: >-
          node scripts/paragraph_spacing_browser.mjs
          --binary target/release/assemblash
          --workspace "${{ runner.temp }}/assemblash-candidate-paragraph-editor"
          --output "${{ runner.temp }}/assemblash-candidate-paragraph-editor-evidence/result.json"
      - name: Save paragraph editor evidence
        if: matrix.target-name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-paragraph-editor
          path: ${{ runner.temp }}/assemblash-candidate-paragraph-editor-evidence/
          if-no-files-found: error
      - name: Verify candidate justify controls against the embedded server
        if: matrix.target-name == 'linux-x86_64'
        run: >-
          node scripts/justification_browser.mjs
          --binary target/release/assemblash
          --workspace "${{ runner.temp }}/assemblash-candidate-justify-editor"
          --output "${{ runner.temp }}/assemblash-candidate-justify-editor-evidence/result.json"
      - name: Save justify editor evidence
        if: matrix.target-name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-justify-editor
          path: ${{ runner.temp }}/assemblash-candidate-justify-editor-evidence/
          if-no-files-found: error
      - name: Verify candidate modifier resizing against the embedded server
        if: matrix.target-name == 'linux-x86_64'
        run: >-
          node scripts/resize_browser.mjs
          --binary target/release/assemblash
          --workspace "${{ runner.temp }}/assemblash-candidate-resize-editor"
          --output "${{ runner.temp }}/assemblash-candidate-resize-editor-evidence/result.json"
      - name: Save resize editor evidence
        if: always() && matrix.target-name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-resize-editor
          path: ${{ runner.temp }}/assemblash-candidate-resize-editor-evidence/
          if-no-files-found: error
      - name: Save the verified candidate binary
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target-name }}
          path: ${{ runner.os == 'Windows' && 'target/release/assemblash.exe' || 'target/release/assemblash' }}
          if-no-files-found: error
      - name: Package the unpublished candidate
        shell: bash
        run: |
          set -eu
          name="assemblash-v1.12.0-${{ matrix.target-name }}"
          mkdir -p "candidate-dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/assemblash.exe "candidate-dist/$name/"
          else
            cp target/release/assemblash "candidate-dist/$name/"
          fi
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md CHANGELOG.md "candidate-dist/$name/"
          cp -R assets "candidate-dist/$name/"
          cd candidate-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); pathlib.Path("SHA256SUMS").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")' "$archive"
      - name: Verify the extracted candidate executable
        shell: bash
        run: |
          set -eu
          name="assemblash-v1.12.0-${{ matrix.target-name }}"
          cd candidate-dist
          python -c 'import hashlib,pathlib; digest,name=pathlib.Path("SHA256SUMS").read_text().split(); assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, "candidate archive checksum mismatch"'
          mkdir extracted
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "$name.zip" -oextracted >/dev/null
            binary="assemblash.exe"
          else
            tar -xzf "$name.tar.gz" -C extracted
            binary="assemblash"
          fi
          cd ..
          python -c 'import hashlib,pathlib,sys; hashes=[hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sys.argv[1:]]; assert len(hashes)==2 and hashes[0]==hashes[1], "extracted candidate executable differs"' "target/release/$binary" "candidate-dist/extracted/$name/$binary"
          python scripts/release_smoke.py \
            --binary "candidate-dist/extracted/$name/$binary" \
            --workspace "${{ runner.temp }}/assemblash-candidate-extracted-smoke" \
            --expected-version 1.12.0
      - name: Install cargo-deb for candidate packaging
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build and install-check the candidate Debian package
        if: runner.os == 'Linux'
        run: |
          set -eu
          cargo deb --package assemblash-cli --no-build --no-strip
          case "${{ matrix.target-name }}" in
            linux-x86_64) arch=amd64 ;;
            linux-aarch64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          package="target/debian/assemblash_1.12.0-1_$arch.deb"
          test "$(dpkg-deb -f "$package" Package)" = assemblash
          test "$(dpkg-deb -f "$package" Version)" = 1.12.0-1
          test "$(dpkg-deb -f "$package" Architecture)" = "$arch"
          cp "$package" candidate-dist/
          sudo apt-get install -y "./$package"
          test "$(/usr/bin/assemblash --version)" = 'assemblash 1.12.0'
          cmp target/release/assemblash /usr/bin/assemblash
          cmp packaging/linux/assemblash.desktop /usr/share/applications/assemblash.desktop
          cmp assets/assemblash-mark.svg /usr/share/icons/hicolor/scalable/apps/assemblash.svg
          cmp NOTICE /usr/share/doc/assemblash/NOTICE
          cmp THIRD_PARTY_LICENSES.md /usr/share/doc/assemblash/THIRD_PARTY_LICENSES.md
          sudo apt-get remove -y assemblash
      - name: Checksum the candidate Debian package
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('candidate-dist')
          packages = list(root.glob('*.deb'))
          if len(packages) != 1:
              raise RuntimeError('expected exactly one candidate Debian package')
          with (root / 'SHA256SUMS').open('a', encoding='utf-8') as output:
              for package in packages:
                  output.write(hashlib.sha256(package.read_bytes()).hexdigest() + '  ' + package.name + '\n')
          PY
      - name: Save the unpublished candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-${{ matrix.target-name }}
          path: |
            candidate-dist/*.zip
            candidate-dist/*.tar.gz
            candidate-dist/*.deb
            candidate-dist/SHA256SUMS
          if-no-files-found: error
      - name: Save the candidate renderer identity report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-renderer-${{ matrix.target-name }}
          path: target/gate/hashes.json
          if-no-files-found: error

  candidate-identity:
    name: Compare candidate renderer bytes on all six targets
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-renderer-*
          path: candidate-renderer-hashes
      - run: python scripts/renderer_identity_compare.py candidate-renderer-hashes --prefix candidate-renderer-
