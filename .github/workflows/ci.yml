name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required community files are present
        run: |
          missing=0
          for f in README.md PRD.md AGENTS.md LICENSE NOTICE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .gitattributes; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No private or generated content committed
        run: |
          # PRD R5: private brand kits, credentials, and customer content must
          # never reach the public repository.
          bad=$(git ls-files | grep -Ei '(^|/)(private|brand|brandkits|customer-assets|downstream)/|(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$|(^|/)node_modules/' || true)
          if [ -n "$bad" ]; then
            echo "::error::files that must not be committed were found:"
            echo "$bad"
            exit 1
          fi

      - name: No AI working directory committed
        run: |
          # .ai/ is local-only scratch space for agent handoffs, roadmaps, notes.
          bad=$(git ls-files | grep -E '^\.ai/' || true)
          if [ -n "$bad" ]; then
            echo "::error::.ai/ is local-only and must stay untracked:"
            echo "$bad"
            exit 1
          fi

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Automates PRD R8: license allowlist, advisories, source allowlist.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    # Determinism is the product: the same code must build and pass on every
    # supported target from the first commit (NFR-1, NFR-2).
    name: Test (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
          - os: windows-latest
            target-name: windows-x86_64
          - os: windows-11-arm
            target-name: windows-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target-name }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
