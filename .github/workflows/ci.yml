name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job carries a `timeout-minutes`. A job that hangs reports nothing —
# no failure, no log, and no result at all until somebody notices and cancels
# it by hand — which is worse than a job that fails. The numbers are several
# times the observed durations on a warm cache, so a cold cache or a slow
# runner still finishes well inside them; they exist to bound a hang, not to
# police a slow build.
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required community files are present
        run: |
          missing=0
          for f in README.md PRD.md AGENTS.md LICENSE NOTICE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .gitattributes; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No private or generated content committed
        run: |
          # PRD R5: private brand kits, credentials, and customer content must
          # never reach the public repository.
          bad=$(git ls-files | grep -Ei '(^|/)(private|brand|brandkits|customer-assets|downstream)/|(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$|(^|/)node_modules/' || true)
          if [ -n "$bad" ]; then
            echo "::error::files that must not be committed were found:"
            echo "$bad"
            exit 1
          fi

      - name: The dependency inventory is committed
        run: |
          # PRD §18. The content is drift-tested by `cargo test`; this only
          # checks the file a reader expects to find is actually there.
          test -f DEPENDENCIES.md

      - name: No local AI working directories committed
        run: |
          # .ai/ holds working notes; .agents/ holds per-tool installed skills.
          # Reusable public agent guidance belongs under skills/ instead.
          bad=$(git ls-files | grep -E '^(\.ai|\.agents)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::local AI working directories must stay untracked:"
            echo "$bad"
            exit 1
          fi

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ui:
    name: Reference interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      # The interface is typed against the declarations generated from the
      # Rust types, so a change to the document model that the UI has not
      # caught up with fails here rather than at runtime. `check` runs the
      # typecheck, the build, and the test suite (ubuntu-latest ships the
      # Chrome the browser journeys need).
      - name: Check (typecheck, build, test)
        working-directory: ui
        run: npm run check

      # ui/dist is committed because the binary embeds it: `cargo build` must
      # work with no Node involved. This is what keeps the committed copy
      # honest.
      - name: The committed build output is the build output
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo "::error::ui/dist is out of date — run: cd ui && npm run build"
            git diff --stat -- ui/dist
            exit 1
          fi

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Automates PRD R8: license allowlist, advisories, source allowlist.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    # Determinism is the product: the same code must build and pass on every
    # supported target from the first commit (NFR-1, NFR-2).
    name: Test (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
          - os: windows-latest
            target-name: windows-x86_64
          - os: windows-11-arm
            target-name: windows-aarch64
          # macos-13 was retired; macos-15-intel is the current Intel runner.
          - os: macos-15-intel
            target-name: macos-x86_64
          - os: macos-14
            target-name: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target-name }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exercise the executable across CLI, HTTP and MCP
        run: >-
          python scripts/release_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-ci-smoke"

      - name: Verify canvas resize, transparency and undo across transports
        run: >-
          python scripts/canvas_smoke.py
          --binary "${{ runner.os == 'Windows' && 'target/debug/assemblash.exe' || 'target/debug/assemblash' }}"
          --workspace "${{ runner.temp }}/assemblash-canvas-smoke"
          --font crates/assemblash-renderer/tests/fonts/NotoSans-Subset.ttf
