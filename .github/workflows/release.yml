name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true
      ref:
        description: >-
          Commit or branch to build from. Defaults to the tag itself. Use it
          only when the packaging changed and the program did not, so the
          binary is still the one the tag names.
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The same six targets CI tests. A target that is not tested does not get a
    # binary: shipping one would be a claim this project does not make.
    name: Build (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    # Generous: the release profile is fat LTO at `codegen-units = 1`, which
    # relinks everything and takes well over ten minutes even locally. The
    # bound is here so a hung build cannot sit unnoticed, not to cap the build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
            archive: tar.gz
          - os: windows-latest
            target-name: windows-x86_64
            archive: zip
          - os: windows-11-arm
            target-name: windows-aarch64
            archive: zip
          # macos-13 was retired; macos-15-intel is the current Intel runner.
          - os: macos-15-intel
            target-name: macos-x86_64
            archive: tar.gz
          - os: macos-14
            target-name: macos-aarch64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target-name }}

      - name: Build the binary
        run: cargo build --release --package assemblash-cli

      - name: Check the binary runs
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/assemblash.exe --version
          else
            ./target/release/assemblash --version
          fi

      - name: Package
        shell: bash
        run: |
          set -eu
          name="assemblash-${{ inputs.tag || github.ref_name }}-${{ matrix.target-name }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/assemblash.exe "dist/$name/"
          else
            cp target/release/assemblash "dist/$name/"
          fi
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md CHANGELOG.md "dist/$name/"
          cp -R assets "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      # A bare executable next to the archive. The binary is self-contained —
      # the editor is compiled into it — so this runs with nothing beside it,
      # and a double-click is the friendly launch. The archive stays the
      # download that carries the licence texts.
      - name: Bare executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          name="assemblash-${{ inputs.tag || github.ref_name }}-${{ matrix.target-name }}"
          cp target/release/assemblash.exe "dist/$name.exe"

      # A .deb so `apt install ./assemblash_*.deb` puts the binary on PATH and
      # the desktop entry in the application menu. cargo-deb reads
      # [package.metadata.deb] in crates/assemblash-cli/Cargo.toml.
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build the Debian package
        if: runner.os == 'Linux'
        run: |
          set -eu
          # --no-build reuses the release binary already checked above;
          # --no-strip because the release profile already strips it.
          cargo deb --package assemblash-cli --no-build --no-strip
          cp target/debian/*.deb dist/

      - name: Check the Debian package installs
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get install -y ./dist/*.deb
          # Installed from the package, not from target/: PATH resolves it.
          assemblash --version
          test -f /usr/share/applications/assemblash.desktop
          test -f /usr/share/doc/assemblash/THIRD_PARTY_LICENSES.md
          sudo apt-get remove -y assemblash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target-name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  attach:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: Verify downloaded release (${{ matrix.target-name }})
    needs: attach
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x86_64
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
          - os: windows-latest
            target-name: windows-x86_64
          - os: windows-11-arm
            target-name: windows-aarch64
          - os: macos-15-intel
            target-name: macos-x86_64
          - os: macos-14
            target-name: macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify checksums and exercise the downloaded executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_release_archive.py
          --tag "${{ inputs.tag || github.ref_name }}"
          --target "${{ matrix.target-name }}"
          --repo "${{ github.repository }}"
